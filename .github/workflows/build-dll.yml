name: Build DLL

on:
  workflow_dispatch:
  push:
    branches:
      - beta
      - beta-webuionly
      - beta-performanceboost
  pull_request:
    branches:
      - beta
      - main

jobs:
  build-dll:
    name: Build veritas.dll
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-17

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-dll"

      - name: Validate local act run
        if: ${{ env.ACT == 'true' }}
        run: cargo metadata --no-deps --format-version 1

      - name: Build release DLL
        if: ${{ env.ACT != 'true' }}
        run: cargo build --release

      - name: Verify DLL output
        if: ${{ env.ACT != 'true' }}
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/veritas.dll")) {
            Write-Error "target/release/veritas.dll was not created"
            exit 1
          }

      - name: Upload DLL artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: veritas-dll
          path: target/release/veritas.dll
          if-no-files-found: error
